name: PR review policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, review_requested, review_request_removed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: review-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  review-policy-update:
    name: review-policy-update
    runs-on: ubuntu-latest
    steps:
      - name: Read trusted base branch policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref || 'main' }}
          persist-credentials: false
      - name: Update approval status
        uses: actions/github-script@v7
        with:
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/review-policy-runner.cjs`);
            await run({ github, context, core });
