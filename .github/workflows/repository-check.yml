name: Repository check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-check:
    name: repository-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check repository metadata
        run: python scripts/check_repository.py
      - name: Check reviewer policy cases
        run: node --test .github/scripts/review-policy.test.cjs
